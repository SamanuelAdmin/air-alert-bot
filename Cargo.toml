[package]
name = "alertbot"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = "1.5.0"
teloxide = { version = "0.17.0", features = ["macros"] }
dptree = "0.5.1"
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version =  "1.8", features = ["rt-multi-thread", "macros"] }
reqwest = "0.13.2"
tera = { version = "1", default-features = false }
hocon = "0.9.0"
serde = "1.0.228"
serde_json = "1.0.149"
dotenv = "0.15.0"
async-trait = "0.1.89"
